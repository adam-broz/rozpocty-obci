[project]
name = "rozpocty-obci"
version = "0.1.0"
description = "Hospodaření českých obcí srozumitelně – datová pipeline nad otevřenými daty MF ČR a ČSÚ"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
